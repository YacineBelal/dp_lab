[project]
name = "dp-lab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Yacine Belal", email = "yacine.belal@cea.fr" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "opendp>=0.16.0",
    "scipy>=1.18.1",
]

[project.scripts]
dp-lab = "dp_lab:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "marimo>=0.25.2",
]
